<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>One Wish Willow</title>
  <meta name="description" content="Snap the One Wish Willow. Make one wish. You only get one.">
  <meta name="theme-color" content="#030303">
  <meta property="og:title" content="One Wish Willow">
  <meta property="og:description" content="You only get one wish.">
  <meta property="og:type" content="website">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="scene"
          tabindex="-1"
          role="img"
          aria-label="The One Wish Willow, a gnarled wooden stick. Press on it and pull to snap it in half. With a keyboard, hold Space."></canvas>

  <div class="grain" aria-hidden="true"></div>

  <p class="gate-title" id="gate-title">You only get <b>one wish.</b></p>

  <button class="gate" id="gate" type="button" aria-label="Open the One Wish Willow box">
    <span class="gate-go" id="gate-go">Tap to begin</span>
  </button>

  <p class="hint" id="hint" aria-live="polite">Press on the willow and pull to snap it.</p>

  <section class="wish" id="wish" aria-hidden="true">
    <div class="wish-inner">
      <h1 class="wish-q" id="wish-q">What do you wish for?</h1>
      <div class="wish-field" id="wish-field">
        <textarea id="wish-input"
                  rows="1"
                  maxlength="140"
                  placeholder="I wish…"
                  aria-label="Your one wish"
                  autocomplete="off"
                  autocapitalize="sentences"
                  spellcheck="false"
                  enterkeyhint="done"></textarea>
        <span class="wish-line" aria-hidden="true"></span>
        <span class="wish-count" id="wish-count" aria-hidden="true"></span>
      </div>
      <button class="hold" id="wish-hold" type="button" disabled>
        <span class="hold-label">Hold to make your wish</span>
        <span class="hold-track" aria-hidden="true"><span class="hold-fill" id="hold-fill"></span></span>
      </button>
      <p class="wish-note" id="wish-note">There is no second wish.</p>
    </div>
  </section>

  <section class="ending" id="ending" aria-live="polite">
    <p class="ending-main" id="ending-main"></p>
    <p class="ending-sub" id="ending-sub"></p>
  </section>

  <canvas id="fx" aria-hidden="true"></canvas>

  <p class="credit" id="credit">
    3D model: <a href="https://sketchfab.com/3d-models/one-wish-willow-from-obsession-movie-7269f920284c4bb7a169ee110034d164" target="_blank" rel="noopener">“One Wish Willow from Obsession movie”</a>
    by <a href="https://sketchfab.com/alyxyuu" target="_blank" rel="noopener">AlyStation</a>
    on Sketchfab · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>
  </p>

  <noscript><p class="noscript">The One Wish Willow needs JavaScript to be broken.</p></noscript>

  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
  <link rel="modulepreload" href="vendor/three/three.module.min.js">
  <link rel="preload" href="assets/willow/willow.gltf" as="fetch" crossorigin>
  <script type="module" src="js/main.js"></script>
</body>
</html>
